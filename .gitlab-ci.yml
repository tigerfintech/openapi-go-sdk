# Two-stage pipeline: unit (no credentials) / integration (real API).
# Mirrors the Python and Java SDK pipelines.
#
# Note: the default runner is a shell executor 
# that ignores the `image:` directive and has no Go toolchain preinstalled,
# so we download a self-contained Go tarball in before_script. Java pipelines
# succeed on the same runner because jdk/maven are preinstalled there.
#
# Integration credentials: TIGEROPEN_TIGER_ID, TIGEROPEN_PRIVATE_KEY,
# TIGEROPEN_ACCOUNT env vars set in GitLab CI Variables (Protected + Masked).

variables:
  # The Go module cache is written read-only. When GOPATH ever landed in
  # the project dir (older pipelines) the leftover .go/ is untracked and
  # breaks `git clean` with "Permission denied". Exclude it so clean does
  # not abort get_sources before checkout runs.
  GIT_CLEAN_FLAGS: "-ff -e .go/"

stages:
  - unit
  - integration

.go_setup: &go_setup
  - |
    GO_VERSION=1.20.14
    ARCH=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
    if command -v go >/dev/null 2>&1; then
      echo "Using preinstalled go: $(go version)"
    else
      echo "Installing go ${GO_VERSION} linux/${ARCH}"
      TARBALL="go${GO_VERSION}.linux-${ARCH}.tar.gz"
      # Aliyun mirror first (reliable from domestic runner), fallback to go.dev.
      # --fail so a soft-404 / HTML error page triggers the fallback instead of
      # leaving a bogus tarball for `tar` to choke on.
      curl --fail -sSL --retry 3 "https://mirrors.aliyun.com/golang/${TARBALL}" -o /tmp/go.tar.gz \
        || curl --fail -sSL --retry 3 "https://go.dev/dl/${TARBALL}" -o /tmp/go.tar.gz
      tar -C /tmp -xzf /tmp/go.tar.gz
      export PATH="/tmp/go/bin:${PATH}"
    fi
  - export GOPATH="/tmp/go-${CI_PIPELINE_ID}"
  - export GOMODCACHE="${GOPATH}/pkg/mod"
  - export GOFLAGS="-mod=readonly"
  - export GOPROXY="https://goproxy.cn,direct"
  - export GOSUMDB=off
  - go version
  - go env GOMODCACHE

unit:go:
  image: golang:1.20
  tags:
    - openapi
  stage: unit
  before_script:
    - *go_setup
  script:
    - go vet ./...
    - go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
    - go tool cover -func=coverage.out | tail -1
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - coverage.out
    expire_in: 1 week

integration:go:
  image: golang:1.20
  tags:
    - openapi
  stage: integration
  allow_failure: true
  variables:
    TIGER_RUN_INTEG: "true"
  before_script:
    - *go_setup
  script:
    - go test -tags=integration -count=1 -v ./quote/ ./trade/
  artifacts:
    when: always
    paths:
      - coverage.out
    expire_in: 1 week

# Pipeline result notification via a generic webhook (e.g. chat
# incoming webhook). WEBHOOK_URL is a masked CI Variable — fork and PR runs
# that do not configure it simply skip this job, so it is safe to ship in an
# open-source repo.
notify:webhook:
  image: python:3.11-slim
  tags:
    - openapi
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl
  stage: .post
  when: always
  allow_failure: true
  dependencies: []
  script:
    - |
      if [ -z "$WEBHOOK_URL" ]; then
        echo "WEBHOOK_URL not configured, skipping notification"
        exit 0
      fi
      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
      JOBS_JSON=$(curl --fail -sS --max-time 10 --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${API}/pipelines/${CI_PIPELINE_ID}/jobs" 2>/dev/null || echo "")
      # Decide pass/fail from job statuses rather than CI_PIPELINE_STATUS, which
      # may still read "running" in a .post when:always job (GitLab known
      # behaviour). jobs API returns name+status only — no trace, no secrets.
      # allow_failure soft-fails don't block the pipeline, so don't list them.
      HAS_FAILED="no"
      FAILED_JOBS=""
      if [ -n "$JOBS_JSON" ] && command -v python3 >/dev/null 2>&1; then
        OUT=$(printf '%s' "$JOBS_JSON" | python3 -c "import sys,json
      try:
        js=json.load(sys.stdin)
        failed=[j['name'] for j in js if j.get('status')=='failed' and not j.get('allow_failure')]
        print('yes' if failed else 'no')
        print(', '.join(failed))
      except Exception:
        print('no'); print('')
      " 2>/dev/null)
        HAS_FAILED=$(printf '%s\n' "$OUT" | sed -n '1p')
        FAILED_JOBS=$(printf '%s\n' "$OUT" | sed -n '2p')
      else
        echo "jobs API or python3 unavailable, falling back to CI_PIPELINE_STATUS"
        if [ "$CI_PIPELINE_STATUS" != "success" ]; then HAS_FAILED="yes"; fi
      fi
      TITLE="✅ Pipeline passed"
      COLOR="green"
      if [ "$HAS_FAILED" = "yes" ]; then
        TITLE="❌ Pipeline failed"
        COLOR="red"
      fi
      CONTENT="**Repo:** ${CI_PROJECT_NAME}\n**Branch:** ${CI_COMMIT_REF_NAME}\n**Commit:** ${CI_COMMIT_SHORT_SHA}\n"
      if [ -n "$FAILED_JOBS" ]; then
        CONTENT="${CONTENT}\n**Failed jobs:** ${FAILED_JOBS}\n"
      fi
      TEST_REPORT=$(curl --fail -sS --max-time 10 --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${API}/pipelines/${CI_PIPELINE_ID}/test_report" 2>/dev/null || echo "")
      TEST_STATS=""
      if [ -n "$TEST_REPORT" ] && command -v python3 >/dev/null 2>&1; then
        TEST_STATS=$(printf '%s' "$TEST_REPORT" | python3 -c "import sys,json; r=json.load(sys.stdin); t=r.get('total',{}); print(f"{t.get('count',0)} tests: {t.get('success',0)} passed, {t.get('failed',0)} failed, {t.get('skipped',0)} skipped")" 2>/dev/null)
      fi
      if [ -n "$TEST_STATS" ]; then
        CONTENT="${CONTENT}\n**Tests:** ${TEST_STATS}\n"
      fi
      CONTENT="${CONTENT}[View pipeline](${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID})"
      PAYLOAD=$(cat <<EOF
      {
        "msg_type": "interactive",
        "card": {
          "header": {
            "title": {"tag": "plain_text", "content": "$TITLE #${CI_PIPELINE_IID} — ${CI_PROJECT_NAME}"},
            "template": "$COLOR"
          },
          "elements": [
            {"tag": "div", "text": {"tag": os.environ["CARD_CONTENT_TAG"], "content": "$CONTENT"}}
          ]
        }
      }
      EOF
      )
      curl --fail -sS --max-time 10 -X POST "$WEBHOOK_URL" \
        -H 'Content-Type: application/json' \
        -d "$PAYLOAD"

