# Two-stage pipeline: unit (no credentials) / integration (real API).
# Mirrors the Python and Java SDK pipelines.
#
# Uses golang:1.20 Docker image with the 'openapi' tagged runner.
# go-junit-report is installed in before_script to convert `go test -v` output
# into JUnit XML for GitLab's test report integration and the notify job.
#
# Integration credentials: TIGEROPEN_TIGER_ID, TIGEROPEN_PRIVATE_KEY,
# TIGEROPEN_ACCOUNT env vars set in GitLab CI Variables (Protected + Masked).

variables:
  # The Go module cache is written read-only. When GOPATH ever landed in
  # the project dir (older pipelines) the leftover .go/ is untracked and
  # breaks `git clean` with "Permission denied". Exclude it so clean does
  # not abort get_sources before checkout runs.
  GIT_CLEAN_FLAGS: "-ff -e .go/"

stages:
  - unit
  - integration

.go_setup: &go_setup
  - |
    GO_VERSION=1.20.14
    ARCH=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
    if command -v go >/dev/null 2>&1; then
      echo "Using preinstalled go: $(go version)"
    else
      echo "Installing go ${GO_VERSION} linux/${ARCH}"
      TARBALL="go${GO_VERSION}.linux-${ARCH}.tar.gz"
      # Aliyun mirror first (reliable from domestic runner), fallback to go.dev.
      # --fail so a soft-404 / HTML error page triggers the fallback instead of
      # leaving a bogus tarball for `tar` to choke on.
      curl --fail -sSL --retry 3 "https://mirrors.aliyun.com/golang/${TARBALL}" -o /tmp/go.tar.gz \
        || curl --fail -sSL --retry 3 "https://go.dev/dl/${TARBALL}" -o /tmp/go.tar.gz
      tar -C /tmp -xzf /tmp/go.tar.gz
      export PATH="/tmp/go/bin:${PATH}"
    fi
  - export GOPATH="/tmp/go-${CI_PIPELINE_ID}"
  - export GOMODCACHE="${GOPATH}/pkg/mod"
  - export GOFLAGS="-mod=readonly"
  - export GOPROXY="https://goproxy.cn,direct"
  - export GOSUMDB=off
  - export PATH="${GOPATH}/bin:${PATH}"
  - go version
  - go env GOMODCACHE
  # Install go-junit-report for JUnit XML test output (v2).
  - go install github.com/jstemmer/go-junit-report/v2@latest

unit:go:
  image: golang:1.20
  tags:
    - openapi
  stage: unit
  before_script:
    - *go_setup
  script:
    - mkdir -p test-results
    - go vet ./...
    - go test -v -race -count=1 -coverprofile=coverage.out -covermode=atomic ./... > /tmp/gotest.log 2>&1; TEST_EXIT=$?
    - cat /tmp/gotest.log | go-junit-report -out test-results/unit.xml || true
    - go tool cover -func=coverage.out | tail -1
    - exit $TEST_EXIT
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - coverage.out
      - test-results/
    reports:
      junit:
        - test-results/unit.xml
    expire_in: 1 week

integration:go:
  image: golang:1.20
  tags:
    - openapi
  stage: integration
  allow_failure: true
  variables:
    TIGER_RUN_INTEG: "true"
  before_script:
    - *go_setup
  script:
    - set -o pipefail
    - mkdir -p test-results
    - go test -tags=integration -v -count=1 ./quote/ ./trade/ 2>&1 | go-junit-report -set-exit-code -out test-results/integ.xml
  artifacts:
    when: always
    paths:
      - test-results/
    reports:
      junit:
        - test-results/integ.xml
    expire_in: 1 week

# Pipeline result notification via Feishu/Lark webhook.
# Parses JUnit XML artifacts directly (no GitLab API dependency, no curl).
# Mirrors the Python SDK notify job structure.
notify:webhook:
  image: python:3.11-slim
  tags:
    - openapi
  stage: .post
  when: always
  allow_failure: true
  needs:
    - job: unit:go
      artifacts: true
    - job: integration:go
      artifacts: true
  script:
    - |
      python3 << 'PYEOF'
      import os, json, urllib.request, glob
      import xml.etree.ElementTree as ET

      webhook_url = os.environ.get("WEBHOOK_URL", "")
      if not webhook_url:
          print("WEBHOOK_URL not configured, skipping notification")
          exit(0)

      # 1. Parse JUnit XML artifacts — split unit/integration stats
      def parse_xml(path):
          t, f, s = 0, 0, 0
          try:
              tree = ET.parse(path)
              root = tree.getroot()
              for suite in root.iter("testsuite"):
                  t += int(suite.get("tests", 0))
                  f += int(suite.get("failures", 0)) + int(suite.get("errors", 0))
                  s += int(suite.get("skipped", 0))
          except Exception as e:
              print(f"Failed to parse {path}: {e}")
          return t, t - f - s, f, s

      unit_t, unit_p, unit_f, unit_s = parse_xml("test-results/unit.xml")
      integ_t, integ_p, integ_f, integ_s = parse_xml("test-results/integ.xml")

      unit_stats = f"Unit: {unit_t} tests: {unit_p} passed, {unit_f} failed, {unit_s} skipped" if unit_t > 0 else ""
      integ_stats = f"Integration: {integ_t} tests: {integ_p} passed, {integ_f} failed, {integ_s} skipped" if integ_t > 0 else ""

      # 2. Determine pass/fail: unit test failures = pipeline failed
      has_failed = unit_f > 0
      status = os.environ.get("CI_PIPELINE_STATUS", "")
      if status == "failed":
          has_failed = True

      # 3. Build Feishu card
      title = "❌ Pipeline failed" if has_failed else "✅ Pipeline passed"
      color = "red" if has_failed else "green"
      project_name = os.environ.get("CI_PROJECT_NAME", "")
      branch = os.environ.get("CI_COMMIT_REF_NAME", "")
      commit = os.environ.get("CI_COMMIT_SHORT_SHA", "")
      pipeline_iid = os.environ.get("CI_PIPELINE_IID", "")
      pipeline_url = os.environ.get("CI_PROJECT_URL", "") + "/-/pipelines/" + os.environ.get("CI_PIPELINE_ID", "")

      content = f"**Repo:** {project_name}\n**Branch:** {branch}\n**Commit:** {commit}\n"
      if unit_stats:
          content += f"\n**Unit tests:** {unit_stats}\n"
      if integ_stats:
          content += f"**Integration tests:** {integ_stats}\n"
      content += f"[View pipeline]({pipeline_url})"

      payload = {
          "msg_type": "interactive",
          "card": {
              "header": {
                  "title": {"tag": "plain_text", "content": f"{title} #{pipeline_iid} — {project_name}"},
                  "template": color
              },
              "elements": [
                  {"tag": "div", "text": {"tag": "lark_md", "content": content}}
              ]
          }
      }

      data = json.dumps(payload).encode("utf-8")
      req = urllib.request.Request(webhook_url, data=data, headers={"Content-Type": "application/json"})
      try:
          with urllib.request.urlopen(req, timeout=10) as resp:
              result = json.loads(resp.read())
              print(f"Feishu response: {result}")
      except Exception as e:
          print(f"Feishu webhook failed: {e}")
      PYEOF
