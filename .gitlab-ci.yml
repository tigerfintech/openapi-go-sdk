# Two-stage pipeline: unit (no credentials) / integration (real API).
# Mirrors the Python and Java SDK pipelines.
#
# Note: the default runner is a shell executor (v004.alihy.platform.tiger)
# that ignores the `image:` directive and has no Go toolchain preinstalled,
# so we download a self-contained Go tarball in before_script. Java pipelines
# succeed on the same runner because jdk/maven are preinstalled there.
#
# Integration credentials: TIGEROPEN_TIGER_ID, TIGEROPEN_PRIVATE_KEY,
# TIGEROPEN_ACCOUNT env vars set in GitLab CI Variables (Protected + Masked).

variables:
  # The Go module cache is written read-only. When GOPATH ever landed in
  # the project dir (older pipelines) the leftover .go/ is untracked and
  # breaks `git clean` with "Permission denied". Exclude it so clean does
  # not abort get_sources before checkout runs.
  GIT_CLEAN_FLAGS: "-ff -e .go/"

stages:
  - unit
  - integration

.go_setup: &go_setup
  - |
    GO_VERSION=1.20.14
    ARCH=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
    if command -v go >/dev/null 2>&1; then
      echo "Using preinstalled go: $(go version)"
    else
      echo "Installing go ${GO_VERSION} linux/${ARCH}"
      TARBALL="go${GO_VERSION}.linux-${ARCH}.tar.gz"
      # Aliyun mirror first (reliable from domestic runner), fallback to go.dev.
      # --fail so a soft-404 / HTML error page triggers the fallback instead of
      # leaving a bogus tarball for `tar` to choke on.
      curl --fail -sSL --retry 3 "https://mirrors.aliyun.com/golang/${TARBALL}" -o /tmp/go.tar.gz \
        || curl --fail -sSL --retry 3 "https://go.dev/dl/${TARBALL}" -o /tmp/go.tar.gz
      tar -C /tmp -xzf /tmp/go.tar.gz
      export PATH="/tmp/go/bin:${PATH}"
    fi
  - export GOPATH="/tmp/go-${CI_PIPELINE_ID}"
  - export GOMODCACHE="${GOPATH}/pkg/mod"
  - export GOFLAGS="-mod=readonly"
  - export GOPROXY="https://goproxy.cn,direct"
  - export GOSUMDB=off
  - go version
  - go env GOMODCACHE

unit:go:
  stage: unit
  before_script:
    - *go_setup
  script:
    - go vet ./...
    - |
      set -o pipefail
      go test -v -race -count=1 -coverprofile=coverage.out -covermode=atomic ./... 2>&1 | tee /tmp/unit.log
      P=$(grep -c '^--- PASS' /tmp/unit.log || true)
      F=$(grep -c '^--- FAIL' /tmp/unit.log || true)
      S=$(grep -c '^--- SKIP' /tmp/unit.log || true)
      echo "TEST_REPORT unit passed=$P failed=$F skipped=$S"
    - go tool cover -func=coverage.out | tail -1
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - coverage.out
    expire_in: 1 week

integration:go:
  stage: integration
  allow_failure: true
  variables:
    TIGER_RUN_INTEG: "true"
  before_script:
    - *go_setup
  script:
    - |
      set -o pipefail
      go test -tags=integration -count=1 -v ./quote/ ./trade/ 2>&1 | tee /tmp/integ.log
      P=$(grep -c '^--- PASS' /tmp/integ.log || true)
      F=$(grep -c '^--- FAIL' /tmp/integ.log || true)
      S=$(grep -c '^--- SKIP' /tmp/integ.log || true)
      echo "TEST_REPORT integration passed=$P failed=$F skipped=$S"
  artifacts:
    when: always
    paths:
      - coverage.out
    expire_in: 1 week

# Pipeline result notification via a generic webhook (e.g. Feishu/Lark
# incoming webhook). WEBHOOK_URL is a masked CI Variable — fork and PR runs
# that do not configure it simply skip this job, so it is safe to ship in an
# open-source repo.
notify:webhook:
  stage: .post
  when: always
  allow_failure: true
  dependencies: []
  script:
    - |
      if [ -z "$WEBHOOK_URL" ]; then
        echo "WEBHOOK_URL not configured, skipping notification"
        exit 0
      fi
      TITLE="✅ Pipeline passed"
      COLOR="green"
      if [ "$CI_PIPELINE_STATUS" = "failed" ]; then
        TITLE="❌ Pipeline failed"
        COLOR="red"
      fi
      # Pull per-job test stats from the unit/integration job traces via the
      # GitLab API (using the job token). Each test job echoes a
      # "TEST_REPORT <stage> passed=N failed=M skipped=K" line at the end.
      STATS=""
      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
      JOBS_JSON=$(curl -sS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${API}/pipelines/${CI_PIPELINE_ID}/jobs" 2>/dev/null || true)
      for jid in $(printf '%s' "$JOBS_JSON" | python3 -c "import sys,json
      try:
        for j in json.load(sys.stdin):
          if j['name'] in ('unit:go','integration:go'):
            print(j['id'])
      except Exception:
        pass" 2>/dev/null); do
        tr=$(curl -sS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${API}/jobs/${jid}/trace" 2>/dev/null || true)
        line=$(printf '%s' "$tr" | grep '^TEST_REPORT ' | tail -1 || true)
        if [ -n "$line" ]; then
          stage=$(echo "$line" | awk '{print $2}')
          stats=$(echo "$line" | sed 's/^TEST_REPORT [^ ]* //')
          STATS="${STATS}**${stage}:** ${stats}\n"
        fi
      done
      CONTENT="**Repo:** ${CI_PROJECT_NAME}\n**Branch:** ${CI_COMMIT_REF_NAME}\n**Commit:** ${CI_COMMIT_SHORT_SHA}\n"
      if [ -n "$STATS" ]; then
        CONTENT="${CONTENT}\n**Test results:**\n${STATS}"
      fi
      CONTENT="${CONTENT}[View pipeline](${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID})"
      PAYLOAD=$(cat <<EOF
      {
        "msg_type": "interactive",
        "card": {
          "header": {
            "title": {"tag": "plain_text", "content": "$TITLE #${CI_PIPELINE_IID} — ${CI_PROJECT_NAME}"},
            "template": "$COLOR"
          },
          "elements": [
            {"tag": "div", "text": {"tag": "lark_md", "content": "$CONTENT"}}
          ]
        }
      }
      EOF
      )
      curl --fail -sS -X POST "$WEBHOOK_URL" \
        -H 'Content-Type: application/json' \
        -d "$PAYLOAD"

